<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="188" viewBox="0 0 1200 188" role="img" aria-labelledby="title desc">
<title id="title">Thank you for coding with us — star Fork Royale</title>
<desc id="desc">Centered thank-you message and star request with decorative neon trails, glowing star and subtle animation.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#080D1B"/><stop offset=".5" stop-color="#17173B"/><stop offset="1" stop-color="#080D1B"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#00E5FF"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<style>
  @keyframes hoverLeft {0%,100%{transform:translateY(0px)}50%{transform:translateY(-7px)}}
  @keyframes hoverRight {0%,100%{transform:translateY(-6px)}50%{transform:translateY(2px)}}
  @keyframes blink {0%,48%,100%{opacity:1}49%,53%{opacity:.25}}
  @keyframes pulse {0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes scan {from{transform:translateX(-1200px)}to{transform:translateX(1250px)}}
  .left-hover{animation:hoverLeft 2.4s ease-in-out infinite}
  .right-hover{animation:hoverRight 2.4s ease-in-out infinite}
  .eye{animation:blink 4.1s infinite}
  .beacon{animation:pulse 1.8s ease-in-out infinite}
  .scan{animation:scan 7s linear infinite}
  @media (prefers-reduced-motion: reduce) {
    .left-hover,.right-hover,.eye,.beacon,.scan {animation:none !important}
  }
</style>
<rect width="1200" height="188" rx="14" fill="url(#bg)"/>
<circle cx="50" cy="22" r="1" fill="#00E5FF" opacity=".35"/><circle cx="199" cy="69" r="2" fill="#B78BFF" opacity=".35"/><circle cx="348" cy="116" r="1" fill="#FF73BC" opacity=".35"/><circle cx="497" cy="163" r="2" fill="#00E5FF" opacity=".35"/><circle cx="646" cy="67" r="1" fill="#B78BFF" opacity=".35"/><circle cx="795" cy="114" r="2" fill="#FF73BC" opacity=".35"/><circle cx="944" cy="161" r="1" fill="#00E5FF" opacity=".35"/><circle cx="1093" cy="65" r="2" fill="#B78BFF" opacity=".35"/><circle cx="142" cy="112" r="1" fill="#FF73BC" opacity=".35"/><circle cx="291" cy="159" r="2" fill="#00E5FF" opacity=".35"/><circle cx="440" cy="63" r="1" fill="#B78BFF" opacity=".35"/><circle cx="589" cy="110" r="2" fill="#FF73BC" opacity=".35"/><circle cx="738" cy="157" r="1" fill="#00E5FF" opacity=".35"/><circle cx="887" cy="61" r="2" fill="#B78BFF" opacity=".35"/><circle cx="1036" cy="108" r="1" fill="#FF73BC" opacity=".35"/><circle cx="85" cy="155" r="2" fill="#00E5FF" opacity=".35"/><circle cx="234" cy="59" r="1" fill="#B78BFF" opacity=".35"/><circle cx="383" cy="106" r="2" fill="#FF73BC" opacity=".35"/><circle cx="532" cy="153" r="1" fill="#00E5FF" opacity=".35"/><circle cx="681" cy="57" r="2" fill="#B78BFF" opacity=".35"/>
<path d="M28 34 L28 15 L100 15 M1100 15 L1172 15 L1172 34 M28 155 L28 175 L100 175 M1100 175 L1172 175 L1172 155" stroke="url(#edge)" stroke-width="3" fill="none"/>
<path d="M50 95 H320 M880 95 H1150" stroke="url(#edge)" opacity=".42" stroke-width="2" stroke-dasharray="7 10"/>
<circle cx="190.00" cy="95" r="6" fill="#B78BFF" opacity="0.69" filter="url(#glow)"/>
<g transform="translate(600 41.00)" class="beacon" opacity="0.690">
  <path d="M0 -19 L6 -6 L21 -4 L10 6 L13 20 L0 13 L-13 20 L-10 6 L-21 -4 L-6 -6 Z" fill="#FFD166" stroke="#FFE4A3" stroke-width="2"/>
</g>
<text x="600" y="96" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="900" font-family="DejaVu Sans, sans-serif" letter-spacing="2">THANK YOU FOR CODING WITH US</text>
<text x="600" y="132" text-anchor="middle" fill="#82E9FA" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif" letter-spacing="1.1">ENJOY THE PROJECT? GIVE IT A STAR AND INVITE A FRIEND.</text>
<text x="600" y="159" text-anchor="middle" fill="#AFB7D6" font-size="12" font-family="DejaVu Sans, sans-serif" letter-spacing="3">ANYONE CAN CODE  •  EVERYONE CAN PLAY</text>
<rect x="96" y="181" width="1008" height="3" rx="1" fill="url(#edge)"/>
</svg>