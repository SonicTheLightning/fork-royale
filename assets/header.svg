<text x="600" y="85" text-anchor="middle" fill="#9EA8D2" font-family="DejaVu Sans, sans-serif" font-size="14" letter-spacing="5" font-weight="bold">THE OPEN SOURCE BOT BATTLEGROUND</text>
<text x="600" y="168" text-anchor="middle" fill="#A855F7" opacity=".58" font-family="DejaVu Sans, sans-serif" font-size="87" font-weight="900" letter-spacing="-3" filter="url(#glow)">FORK ROYALE</text>
<text x="600" y="168" text-anchor="middle" fill="#F7FAFF" font-family="DejaVu Sans, sans-serif" font-size="87" font-weight="900" letter-spacing="-3" stroke="#0C1430" stroke-width="2" paint-order="stroke fill">FORK ROYALE</text>
