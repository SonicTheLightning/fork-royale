      </g>
    </g>
<g transform="translate(1025 168)">
      <g class="right-hover">
        <rect x="-64" y="-72" width="128" height="144" rx="26" fill="#FF4D8D" opacity=".055"/>
        <rect x="-46" y="-46" width="92" height="75" rx="13" fill="#111C39" stroke="#FF4D8D" stroke-width="4"/>
        <rect x="-38" y="-38" width="76" height="58" rx="10" fill="#15244A"/>
        <rect x="-22" y="-5" width="15" height="14" rx="3" fill="#FF4D8D" class="eye"/>
