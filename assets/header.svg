<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Fork Royale — code your bot, enter the arena</title>
<desc id="desc">Futuristic neon game arena with two hovering robot rivals; color scheme dark navy, cyan, violet, and magenta. Decorative animation.</desc>
<defs>
 <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#080D1B"/><stop offset=".48" stop-color="#111638"/><stop offset="1" stop-color="#090E20"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#A855F7" stop-opacity=".3"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#00E5FF"/><stop offset=".53" stop-color="#A855F7"/><stop offset="1" stop-color="#FF4D8D"/></linearGradient>
 <filter id="glow" x="-40%" y="-80%" width="180%" height="250%"><feGaussianBlur stdDeviation="9"/></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 H0 V40" fill="none" stroke="#34456F" stroke-width="1" opacity=".32"/></pattern>
</defs>

<style>
  /* One 8s master cycle; every first frame is identical to the last. */
  @keyframes leftCycle {
    0%, 100% { transform: translate(0px, 0px); }
    25% { transform: translate(8px, -7px); }
    50% { transform: translate(0px, 0px); }
    75% { transform: translate(-4px, 5px); }
  }
  @keyframes rightCycle {
    0%, 100% { transform: translate(0px, 0px); }
    25% { transform: translate(-4px, 5px); }
    50% { transform: translate(0px, 0px); }
    75% { transform: translate(-8px, -7px); }
  }
  @keyframes blink {
    0%, 17%, 21%, 67%, 71%, 100% { opacity: 1; }
    19%, 69% { opacity: .16; }
  }
  @keyframes pulse {
    0%, 100% { opacity: .58; }
    50% { opacity: 1; }
  }
  @keyframes orbit {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes starFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }
  .left-hover { animation: leftCycle 8s ease-in-out infinite; }
  .right-hover { animation: rightCycle 8s ease-in-out infinite; }
  .eye { animation: blink 8s ease-in-out infinite; }
  .beacon { animation: pulse 8s ease-in-out infinite; }
  .orbit-left { transform-origin: 175px 158px; animation: orbit 8s linear infinite; }
  .orbit-right { transform-origin: 1025px 158px; animation: orbit 8s linear infinite reverse; }
  .star-float { animation: starFloat 8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .left-hover, .right-hover, .eye, .beacon,
    .orbit-left, .orbit-right, .star-float { animation: none !important; }
  }
</style>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<ellipse cx="600" cy="158" rx="380" ry="188" fill="url(#halo)"/>
<path d="M0 10 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 32 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 54 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 76 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 98 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 120 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 142 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 164 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 186 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 208 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 230 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 252 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 274 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 296 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><path d="M0 318 H1200" stroke="#8F6CFF" stroke-opacity=".11" /><circle cx="60" cy="25" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="227" cy="108" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="394" cy="191" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="561" cy="274" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="728" cy="107" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="895" cy="190" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="1062" cy="273" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="149" cy="106" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="316" cy="189" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="483" cy="272" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="650" cy="105" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="817" cy="188" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="984" cy="271" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="71" cy="104" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="238" cy="187" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="405" cy="270" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="572" cy="103" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="739" cy="186" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="906" cy="269" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="1073" cy="102" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="160" cy="185" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="327" cy="268" r="2" fill="#2BDBFF" opacity="0.25" /><circle cx="494" cy="101" r="1" fill="#B69BFF" opacity="0.39" /><circle cx="661" cy="184" r="1" fill="#FF73BC" opacity="0.53" /><circle cx="828" cy="267" r="2" fill="#2BDBFF" opacity="0.25" />
<path d="M18 68 V18 H82 M1118 18 H1182 V68 M18 250 V302 H82 M1118 302 H1182 V250" stroke="url(#edge)" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M70 282 H1130" stroke="url(#edge)" stroke-width="2" opacity=".8"/>
