        <path d="M -14 23 H14" stroke="#FF4D8D" stroke-width="3" stroke-linecap="round"/>
        <rect x="-26" y="31" width="52" height="29" rx="9" fill="#15244A" stroke="#FF4D8D" stroke-width="3"/>
